[package]
name = "workstation-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Central gráfica nativa COSMIC para gerenciamento da workstation Pop!_OS e Homelab umbrelOS"
repository = "https://github.com/rezendepauloh/popos-workstation-setup"

[lib]
doctest = false

[dependencies]
chrono = "0.4"
dirs = "5.0"
futures = "0.3"
open = "5.3"
portable-pty = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "about",
    "single-instance",
    "wgpu",
    "xdg-portal",
]
